# Production Profile Configuration
spring.application.name=Neurozen Platform

# Server Configuration
server.port=${PORT:8080}

# Spring DataSource Configuration - PostgreSQL Render
# DATABASE_URL is parsed by DataSourceConfig.java

# Spring Data JPA Configuration
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.naming.physical-strategy=com.neurozen.platform.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy
spring.jpa.open-in-view=false

